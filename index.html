<!DOCTYPE html>
<html>
<head>
    <title>My Unblocked Soundboard</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; max-width: 800px; margin: 0 auto; }
        button { background: #333; color: white; border: none; padding: 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:active { background: #555; }
    </style>
</head>
<body>
    <h1>🔊 Unblocked Soundboard</h1>
    <p>Tap a button to play</p>
    <div class="grid">
        <button onclick="new Audio('https://soundjay.com').play()">Click Sound</button>
        <button onclick="new Audio('https://myinstants.com').play()">Airhorn</button>
        <button onclick="new Audio('https://myinstants.com').play()">Vine Boom</button>
        <button onclick="new Audio('https://myinstants.com').play()">Bruh</button>
    </div>
</body>
</html>
